# ⚠️ EXEMPLO - NÃO USAR EM PRODUÇÃO
# Use kubectl create secret ou um gerenciador de secrets (ex: Sealed Secrets, External Secrets)

apiVersion: v1
kind: Secret
metadata:
  name: appsmith-secrets
  namespace: appsmith
type: Opaque
stringData:
  # MongoDB URI
  mongodb-uri: "mongodb://mongodb:27017/appsmith"
  
  # Encryption password (gerar uma string aleatória forte)
  encryption-password: "SUA_SENHA_FORTE_AQUI"
  
  # Encryption salt (gerar uma string aleatória)
  encryption-salt: "SEU_SALT_AQUI"

---
# Como criar o secret via kubectl:
# kubectl create secret generic appsmith-secrets \
#   --from-literal=mongodb-uri='mongodb://mongodb:27017/appsmith' \
#   --from-literal=encryption-password='SUA_SENHA_FORTE' \
#   --from-literal=encryption-salt='SEU_SALT' \
#   -n appsmith

