apiVersion: apps/v1
kind: Deployment
metadata:
  name: appsmith-frontend
  namespace: appsmith
  labels:
    app: appsmith-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appsmith-frontend
  template:
    metadata:
      labels:
        app: appsmith-frontend
    spec:
      initContainers:
      - name: copy-static-files
        image: appsmith-frontend:latest
        command: ["sh", "-c"]
        args:
        - |
          cp -r /app/build/* /shared/
        volumeMounts:
        - name: frontend-static
          mountPath: /shared
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: frontend-static
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: frontend-static
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: appsmith-nginx-config

