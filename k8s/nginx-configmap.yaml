apiVersion: v1
kind: ConfigMap
metadata:
  name: appsmith-nginx-config
  namespace: appsmith
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types 
            text/plain 
            text/css 
            text/xml 
            text/javascript 
            application/x-javascript 
            application/xml+rss 
            application/json 
            application/javascript;

        # Servir arquivos estáticos do React
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache para assets estáticos (JS, CSS, imagens, fonts)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
            
            # Sem cache para index.html (para permitir atualizações)
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # Proxy para API do backend
        location /api/ {
            proxy_pass http://appsmith-backend:8080/api/;
            proxy_http_version 1.1;
            
            # Headers básicos
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers importantes para CSRF do Appsmith
            proxy_set_header X-Appsmith-Version $http_x_appsmith_version;
            proxy_set_header X-Requested-By $http_x_requested_by;
            
            # Preservar Content-Type original
            proxy_set_header Content-Type $content_type;
            
            # WebSocket support (se necessário)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering desabilitado para streaming
            proxy_buffering off;
            
            # Cookies
            proxy_cookie_path / /;
        }

        # Proxy para OAuth2
        location /oauth2/ {
            proxy_pass http://appsmith-backend:8080/oauth2/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Appsmith-Version $http_x_appsmith_version;
            proxy_set_header X-Requested-By $http_x_requested_by;
            proxy_cookie_path / /;
        }

        # Proxy para Login
        location /login {
            proxy_pass http://appsmith-backend:8080/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Appsmith-Version $http_x_appsmith_version;
            proxy_set_header X-Requested-By $http_x_requested_by;
            proxy_cookie_path / /;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
    
    # Configuração para WebSocket (se necessário)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

